# Caddy shared by the host's projects: automatic HTTPS and routing by
# domain. Generated by `nelcota init`. The Caddyfile (config/) is regenerated on
# every `nelcota init`/`remove`: do not edit it by hand.
name: nelcota-edge

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./config:/etc/caddy:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [edge]

networks:
  edge:
    name: nelcota_edge
    external: true

volumes:
  caddy_data:
  caddy_config:
