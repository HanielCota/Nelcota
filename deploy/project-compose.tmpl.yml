# Project "{{PROJECT}}". Generated by `nelcota init` at {{GENERATED_AT}}. Feel free to edit.
# Postgres stays on the project's internal network; the app also joins the network
# shared with Caddy (nelcota_edge), where it answers as app-{{PROJECT}}.
name: nelcota-{{PROJECT}}

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    # Profile: {{PROFILE}} (deploy/postgres/profiles/{{PROFILE}}.conf)
    command:
      - postgres
{{POSTGRES_ARGS}}
    shm_size: 256mb
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [internal]

  app:
    image: ${NELCOTA_IMAGE}:${NELCOTA_VERSION}
    restart: unless-stopped
    env_file: .env
    environment:
      NELCOTA_LISTEN: 0.0.0.0:8000
      NELCOTA_TRUST_PROXY: "true"
      NELCOTA_PROJECT_NAME: {{PROJECT}}
      NELCOTA_HOST_REGISTRY: /etc/nelcota/shared/projects.json
    volumes:
      - ./migrations:/migrations:ro
      - ../../shared:/etc/nelcota/shared:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/usr/local/bin/nelcota", "healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    networks:
      internal: {}
      edge:
        aliases: [app-{{PROJECT}}]

networks:
  internal:
    internal: true
  edge:
    name: nelcota_edge
    external: true

volumes:
  pgdata:
