# Weekly version updates, grouped per ecosystem so they arrive as one PR
# each. New releases wait a week first: a compromised version is usually
# caught and yanked within days. Security updates are not delayed.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      cargo:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /crates/admin/ui
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      panel:
        patterns: ["*"]
    ignore:
      # TypeScript 7 (the native port) drops the compiler API that
      # svelte-check needs; its peer range stops at 6. Lift this once
      # svelte-check supports 7.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
