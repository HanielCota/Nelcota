# Weekly version updates, grouped per ecosystem so they arrive as one PR
# each. New releases wait a week first: a compromised version is usually
# caught and yanked within days. Security updates are not delayed.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      cargo:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /crates/admin/ui
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      panel:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
