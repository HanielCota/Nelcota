name: Release

on:
  push:
    tags: ["v*"]

# Each job asks for what it needs.
permissions:
  contents: read

jobs:
  binaries:
    permissions:
      contents: write # release assets
      id-token: write # provenance attestation
      attestations: write
    strategy:
      matrix:
        target: [x86_64-unknown-linux-musl, aarch64-unknown-linux-musl]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: houseabsolute/actions-rust-cross@85826e468eac832e251ac58f6191ba784db237c8 # v1.0.8
        with:
          target: ${{ matrix.target }}
          args: "--release --locked -p nelcota-server"
      - name: Package binary + checksum
        run: |
          cp target/${{ matrix.target }}/release/nelcota nelcota-${{ matrix.target }}
          sha256sum nelcota-${{ matrix.target }} > nelcota-${{ matrix.target }}.sha256
      # Signed build provenance: `gh attestation verify <file> -R HanielCota/Nelcota`.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: nelcota-${{ matrix.target }}
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: |
            nelcota-${{ matrix.target }}
            nelcota-${{ matrix.target }}.sha256
      # The image job packs these same binaries.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nelcota-${{ matrix.target }}
          path: nelcota-${{ matrix.target }}

  image:
    needs: binaries
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: nelcota-*
          path: artifacts
          merge-multiple: true
      # Docker names the architectures amd64/arm64 (TARGETARCH).
      - name: Binaries per Docker architecture
        run: |
          mkdir -p dist
          cp artifacts/nelcota-x86_64-unknown-linux-musl dist/nelcota-amd64
          cp artifacts/nelcota-aarch64-unknown-linux-musl dist/nelcota-arm64
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The image tag is the version without the "v" (same as NELCOTA_VERSION from init).
      - id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      # `nelcota-server`, not the repository name: ghcr.io/hanielcota/nelcota
      # belongs to an earlier project still deployed from it (D76). GHCR only
      # accepts lowercase names.
      - id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/nelcota-server" >> "$GITHUB_OUTPUT"
      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: deploy/release.Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          # Links the GHCR package to this repository (and its Actions access).
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          tags: |
            ${{ steps.image.outputs.name }}:${{ steps.version.outputs.value }}
            ${{ steps.image.outputs.name }}:latest
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
