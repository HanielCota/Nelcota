name: SDK release

# Publishes @nelcota/client to npm from a `sdk-v<version>` tag, with npm
# trusted publishing (OIDC, no token stored in the repository) and a
# provenance statement linking the package to this workflow run.
# Before the first run, add this repository and workflow as a trusted
# publisher of @nelcota/client on npmjs.com.

on:
  push:
    tags: ['sdk-v*']

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: sdk/typescript
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: tag matches the package version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$TAG" != "sdk-v$version" ]; then
            echo "::error::tag $TAG does not match package.json version $version"
            exit 1
          fi
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run check
      - run: npm test
      - run: npm run test:types
      - run: npm run build
      - run: npm run size
      - run: npm publish --access public --provenance
