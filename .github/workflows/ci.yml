name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      # Integration tests start Postgres 17 via testcontainers (the runner's Docker).
      - run: cargo test --all

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  # The panel build (crates/admin/ui/dist) is versioned so `cargo build` does
  # not depend on Node. This job makes sure it is up to date.
  admin-ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/admin/ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: crates/admin/ui/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run check
      - run: npm test
      - run: npm run build
      # status (not diff): also catches a new file that was not versioned or a
      # versioned file the build no longer produces.
      - name: versioned dist is up to date
        run: |
          changes=$(git status --porcelain -- dist)
          if [ -n "$changes" ]; then
            echo "$changes"
            echo "::error::dist is out of date: run npm run build and commit the result"
            exit 1
          fi
