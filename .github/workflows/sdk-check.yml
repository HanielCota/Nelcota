name: SDK verification

on:
  workflow_call:

permissions:
  contents: read

jobs:
  sdk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/typescript
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d
        with:
          toolchain: '1.99.0'
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run check
      - run: npm test
      - run: npm run test:types
      - run: npm run build
      - run: npm run size
      - run: npm run test:package
      - run: node test/runtime/smoke.mjs
      - run: bun test/runtime/smoke.mjs
      - run: deno run --allow-net --allow-read --allow-env test/runtime/smoke.mjs
      - run: cargo build -p nelcota-server
        working-directory: .
      - run: npx playwright-core install --with-deps chromium firefox webkit
      - run: node scripts/contract.mjs --browser
        env:
          NELCOTA_SDK_BROWSERS: chromium,firefox,webkit

  sdk-node:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 26]
    defaults:
      run:
        working-directory: sdk/typescript
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run test:types
      - run: npm run build
      - run: npm run test:package
      - run: node test/runtime/smoke.mjs
