name: Usage question
description: Ask about documented behavior or configuration.
labels: [question]
body:
  - type: markdown
    attributes:
      value: "Check docs/README.md and Discussions first. Never include credentials or personal data. Report vulnerabilities privately through SECURITY.md."
  - type: textarea
    id: question
    attributes:
      label: Question and context
      description: What are you trying to do, and which guide or behavior is unclear?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version and runtime
      description: Server/SDK version or commit; Docker, systemd or dev.
    validations:
      required: true
