<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nelcota — exemplo JavaScript</title>
<script type="importmap">{"imports":{"@nelcota/client":"/dist/index.js"}}</script>
<style>body{font:16px system-ui;max-width:680px;margin:48px auto;padding:0 20px}form{display:grid;gap:12px;margin:24px 0}label{display:grid;gap:4px}input,button{font:inherit;padding:8px}pre{white-space:pre-wrap;overflow-wrap:anywhere}button{cursor:pointer}</style>
<h1>Nelcota em JavaScript</h1>
<p>Prepare <code>examples/schema.sql</code> no projeto e conecte a sua API.</p>
<form id="auth">
  <label>URL da API <input name="url" type="url" value="http://127.0.0.1:8000" required></label>
  <label>Email <input name="email" type="email" autocomplete="username" required></label>
  <label>Senha <input name="password" type="password" autocomplete="current-password" required></label>
  <button name="action" value="signin">Entrar</button>
  <button name="action" value="signup">Criar conta</button>
</form>
<form id="note">
  <label>Nota <input name="body" required></label>
  <button>Salvar nota</button>
</form>
<form id="file">
  <label>Arquivo <input name="file" type="file" required></label>
  <button>Enviar arquivo</button>
</form>
<button id="list">Consultar notas</button>
<button id="logout">Sair</button>
<pre id="result" role="status" aria-live="polite">Entre para começar.</pre>
<script type="module" src="/examples/browser.js"></script>
</html>
