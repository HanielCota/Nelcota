# DEVELOPMENT environment: Postgres only. The binary runs with `cargo run`.
# (The production compose, with app + Caddy, is generated by `nelcota init`.)
name: nelcota-dev

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
    ports:
      # Localhost only: Postgres is never exposed on the network.
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
